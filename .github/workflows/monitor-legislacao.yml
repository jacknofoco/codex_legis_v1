name: Monitor legislativo

on:
  schedule:
    - cron: "17 9 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - id: monitor
        continue-on-error: true
        run: legislacao verificar-atualizacoes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-atualizacao
          path: updates/report.md
      - name: Abrir alerta
        if: steps.monitor.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('updates/report.md', 'utf8');
            const title = '⚠️ Possível alteração em fonte legislativa oficial';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            const alreadyOpen = existing.data.some(issue => issue.title === title);
            if (!alreadyOpen) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
